apiVersion: v1
kind: Namespace
metadata:
  name: chapter4-path-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: destination
  namespace: chapter4-path-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chapter4-path-destination
  template:
    metadata:
      labels:
        app: chapter4-path-destination
    spec:
      containers:
        - name: destination
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          args: ["netexec", "--http-port=8080"]
          ports:
            - name: http
              containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: destination
  namespace: chapter4-path-test
spec:
  selector:
    app: chapter4-path-destination
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: destination
  namespace: chapter4-path-test
spec:
  ingressClassName: contour
  rules:
    - host: service-a.chapter4.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: destination
                port:
                  number: 8080
