apiVersion: apps/v1
kind: Deployment
metadata:
  name: chapter-4-demo
  namespace: workload-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: chapter-4-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chapter-4-demo
    spec:
      containers:
        - name: responder
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          args: ["netexec", "--http-port=8080"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
